openapi: 3.1.0
info:
  title: Physical AI Textbook - Chat API
  description: |
    Backend chat communication service that enables the frontend Chatbot UI to communicate
    with an educational AI agent. The agent provides responses about Physical AI and
    Humanoid Robotics, guided by the project's Global Constitution principles.

    Built with:
    - FastAPI backend framework
    - OpenAI Agent SDK for agent orchestration
    - Gemini 2.0 Flash via LiteLLM for language model

  version: 1.0.0
  contact:
    name: Physical AI Textbook Project
    url: https://github.com/your-org/physical-ai-textbook

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.physical-ai-textbook.com
    description: Production server

tags:
  - name: chat
    description: Chat endpoints for student-agent interaction

paths:
  /chat:
    post:
      tags:
        - chat
      summary: Send a question to the educational AI tutor
      description: |
        Accepts a student's question about Physical AI or Humanoid Robotics and returns
        an educational response from the AI tutor agent.

        **Rate Limiting**: 10 requests per minute per client

        **Timeout**: 30 seconds maximum

        **Success Criteria**:
        - Question must be 3-10,000 characters
        - Response generated within 10 seconds (typical)
        - Educational quality aligned with Global Constitution

      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentQuestion'
            examples:
              basic_question:
                summary: Basic conceptual question
                value:
                  question: "What is Physical AI?"
              technical_question:
                summary: Technical implementation question
                value:
                  question: "How do ROS 2 nodes communicate with each other?"
              practical_question:
                summary: Practical application question
                value:
                  question: "Can you explain how to create a URDF model for a robotic arm?"

      responses:
        '200':
          description: Successful response from the AI tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorResponse'
              examples:
                successful_response:
                  summary: Successful educational response
                  value:
                    response: "Physical AI refers to artificial intelligence systems that interact with and manipulate the physical world through robotics. Unlike traditional AI that operates in digital environments, Physical AI requires understanding of physics, sensor data, and actuator control."
                    agent_name: "Educational Tutor"
                    timestamp: "2025-12-14T10:30:00Z"

        '422':
          description: Validation error - question doesn't meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                too_short:
                  summary: Question too short (< 3 characters)
                  value:
                    error_type: "validation"
                    message: "Question must be at least 3 characters long"
                    field: "question"
                    timestamp: "2025-12-14T10:30:00Z"
                too_long:
                  summary: Question too long (> 10,000 characters)
                  value:
                    error_type: "validation"
                    message: "Question must not exceed 10,000 characters"
                    field: "question"
                    timestamp: "2025-12-14T10:30:00Z"
                empty_question:
                  summary: Empty or whitespace-only question
                  value:
                    error_type: "validation"
                    message: "Question cannot be empty or only whitespace"
                    field: "question"
                    timestamp: "2025-12-14T10:30:00Z"

        '429':
          description: Rate limit exceeded (> 10 requests per minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                rate_limit_exceeded:
                  summary: Too many requests from same client
                  value:
                    error_type: "rate_limit"
                    message: "You have exceeded the limit of 10 requests per minute. Please wait before trying again."
                    field: null
                    timestamp: "2025-12-14T10:30:00Z"

        '500':
          description: Service error - AI tutor unavailable or internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                service_unavailable:
                  summary: AI service is unavailable
                  value:
                    error_type: "service"
                    message: "The tutor service is temporarily unavailable. Please try again later."
                    field: null
                    timestamp: "2025-12-14T10:30:00Z"
                empty_response:
                  summary: AI returned empty response
                  value:
                    error_type: "service"
                    message: "The tutor service returned an empty response. Please rephrase your question and try again."
                    field: null
                    timestamp: "2025-12-14T10:30:00Z"
                configuration_error:
                  summary: Missing API credentials
                  value:
                    error_type: "service"
                    message: "The tutor service is not properly configured. Please contact support."
                    field: null
                    timestamp: "2025-12-14T10:30:00Z"

        '504':
          description: Request timeout (> 30 seconds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                timeout:
                  summary: Request exceeded 30-second timeout
                  value:
                    error_type: "timeout"
                    message: "The request timed out after 30 seconds. Please try again later."
                    field: null
                    timestamp: "2025-12-14T10:30:00Z"

  /health:
    get:
      tags:
        - health
      summary: Health check endpoint
      description: Returns service health status and readiness
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy and ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  agent_ready:
                    type: boolean
                    description: Whether the AI agent is initialized and ready
                  timestamp:
                    type: string
                    format: date-time
              examples:
                healthy:
                  summary: Service is healthy
                  value:
                    status: "healthy"
                    agent_ready: true
                    timestamp: "2025-12-14T10:30:00Z"

components:
  schemas:
    StudentQuestion:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 10000
          description: The student's learning question about Physical AI or Humanoid Robotics
          example: "What is Physical AI and how does it differ from traditional AI?"
      description: |
        Represents a question from a student. Must meet validation requirements:
        - Minimum 3 characters (prevents empty/trivial input)
        - Maximum 10,000 characters (prevents abuse and token overflow)
        - Cannot be only whitespace

    TutorResponse:
      type: object
      required:
        - response
        - agent_name
        - timestamp
      properties:
        response:
          type: string
          description: Educational response from the AI tutor, aligned with Global Constitution principles
          example: "Physical AI refers to artificial intelligence systems that interact with and manipulate the physical world through robotics..."
        agent_name:
          type: string
          description: Name of the agent that generated this response
          example: "Educational Tutor"
        timestamp:
          type: string
          format: date-time
          description: When the response was generated (ISO 8601 UTC)
          example: "2025-12-14T10:30:00Z"
      description: |
        Response from the educational AI tutor. Guaranteed to be:
        - Non-empty and educational
        - Aligned with Physical AI/Robotics topics
        - Guided by Global Constitution principles

    ValidationError:
      type: object
      required:
        - error_type
        - message
        - timestamp
      properties:
        error_type:
          type: string
          enum:
            - validation
            - service
            - timeout
            - rate_limit
          description: Category of error for client handling
        message:
          type: string
          description: User-friendly error message explaining what went wrong
          example: "Question must be at least 3 characters long"
        field:
          type: string
          nullable: true
          description: Field that failed validation (null for non-validation errors)
          example: "question"
        timestamp:
          type: string
          format: date-time
          description: When the error occurred (ISO 8601 UTC)
          example: "2025-12-14T10:30:00Z"
      description: |
        Error response with clear, actionable feedback. Error types:
        - validation: Input validation failed (422)
        - service: AI service unavailable (500)
        - timeout: Request took > 30 seconds (504)
        - rate_limit: Too many requests (429)

  securitySchemes:
