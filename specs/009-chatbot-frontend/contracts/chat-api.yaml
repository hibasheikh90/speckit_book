openapi: 3.0.0
info:
  title: Chat API
  description: API contract for the chatbot frontend integration
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /chat:
    post:
      summary: Send a message to the AI tutor
      description: Sends a user message to the AI tutor and receives a response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response from AI tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User's message to send to the AI tutor
          minLength: 3
          maxLength: 10000
          example: "What is Physical AI?"
      example:
        message: "What is Physical AI?"

    ChatResponse:
      type: object
      required:
        - response
        - agent_name
      properties:
        response:
          type: string
          description: AI tutor's response to the user's message
          example: "Physical AI is a field that combines artificial intelligence with physical systems..."
        agent_name:
          type: string
          description: Name of the agent that generated the response
          example: "Educational Tutor"
        timestamp:
          type: string
          format: date-time
          description: When the response was generated
          example: "2025-12-23T10:00:00.000Z"

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message explaining what went wrong
          example: "Message is too long. Please keep your message under 10,000 characters."